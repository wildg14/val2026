<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beehiivtest - simulerad sajtbyggarsida</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%272%27 fill=%27%2310241c%27/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #fff; }
  .meny { position: sticky; top: 0; height: 89px; background: #10241c; color: #fff; display: flex;
          align-items: center; gap: 24px; padding: 0 24px; z-index: 10; }
  .meny a { color: #fff; text-decoration: none; }
  .sida { max-width: 1240px; margin: 0 auto; }
  iframe#block { display: block; width: 100%; border: 0; }
  .fyllnad { height: 900px; }
</style>
</head>
<body>
<nav class="meny"><strong>Majposten</strong><a href="#">Nyhetsbrev</a><a href="#">Val 2026</a></nav>
<div class="sida">
  <div class="fyllnad" aria-hidden="true"></div>
  <iframe id="block" title="Så röstade Majorna" scrolling="no"></iframe>
</div>
<script>
(function () {
  // Efterliknar Beehiivs HTML-block: en <iframe srcdoc> med samma ursprung som sidan, ingen egen
  // rullning (höjden följer innehållet via ResizeObserver), sökvägarna till css/js är absoluta.
  var srcdoc = '<!doctype html><html lang="sv"><head><meta charset="utf-8">' +
    '<link rel="stylesheet" href="/valgrafik.css"></head>' +
    '<body style="margin:0">' +
    '<div class="mp-val" id="valgrafik"></div>' +
    '<script src="/valgrafik.js"><' + '/script>' +
    '</body></html>';
  var iframe = document.getElementById("block");
  iframe.setAttribute("srcdoc", srcdoc);
  iframe.addEventListener("load", function () {
    var doc = iframe.contentDocument;
    function satt() { iframe.style.height = doc.documentElement.scrollHeight + "px"; }
    satt();
    if ("ResizeObserver" in window) new ResizeObserver(satt).observe(doc.documentElement);
    else setInterval(satt, 500);
  });
})();
</script>
</body>
</html>
